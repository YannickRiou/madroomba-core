<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MadRoomba</title>
<style>
  :root{
    --color-navy:#113B54; --color-chartreuse:#DBE64C; --color-white:#FFFFFF;
    --color-periwinkle:#BBD1FF; --color-water-green:#E2F4DF; --color-pine:#024442;
  }
  *{box-sizing:border-box; margin:0}
  body{
    font-family:'Mulish', system-ui, sans-serif; color:var(--color-navy);
    background:var(--color-white); height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:16px; padding:10px 18px;
    background:var(--color-navy); color:var(--color-white);
  }
  header h1{font-family:'Funnel Display', sans-serif; font-weight:700; font-size:20px; letter-spacing:.5px}
  header .stat{font-size:13px; opacity:.95}
  header .stat b{color:var(--color-chartreuse)}
  #battbar{width:90px; height:10px; border:1px solid var(--color-white); border-radius:5px; overflow:hidden; display:inline-block; vertical-align:middle}
  #battfill{height:100%; width:0%; background:var(--color-chartreuse)}
  main{flex:1; min-height:0; display:flex; gap:14px; padding:14px}
  #maparea{flex:1; min-width:0; min-height:0; background:var(--color-water-green); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px}
  /* flex-basis 0 + min-height 0: without them the canvas height attribute
     feeds back into layout and the canvas grows without bound */
  #cv{width:100%; flex:1 1 0; min-height:0; background:var(--color-white); border-radius:8px; touch-action:none}
  #side{width:270px; display:flex; flex-direction:column; gap:12px; overflow-y:auto}
  .card{background:var(--color-periwinkle); border-radius:12px; padding:12px}
  .card h2{font-family:'Funnel Display', sans-serif; font-size:14px; margin-bottom:8px}
  #pad{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  #pad button{
    font-size:20px; padding:10px 0; border:none; border-radius:8px; cursor:pointer;
    background:var(--color-white); color:var(--color-navy); font-weight:600;
  }
  #pad button:active{background:var(--color-chartreuse)}
  #stopbtn{background:var(--color-navy) !important; color:var(--color-chartreuse) !important}
  .actions{display:flex; flex-wrap:wrap; gap:6px}
  .actions button{
    flex:1 1 45%; padding:8px 4px; border:none; border-radius:8px; cursor:pointer;
    background:var(--color-white); color:var(--color-pine); font-weight:600; font-size:12px;
  }
  .actions button:hover{background:var(--color-chartreuse); color:var(--color-navy)}
  label{font-size:12px; font-weight:600}
  input[type=range]{width:100%; accent-color:var(--color-navy)}
  #cam{width:100%; border-radius:8px; display:none; background:#000}
  #legend{font-size:11px; color:var(--color-pine); display:flex; gap:12px; flex-wrap:wrap}
  .sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px; vertical-align:middle}
  #conn{font-size:12px; padding:2px 8px; border-radius:10px; background:var(--color-chartreuse); color:var(--color-navy); font-weight:700}
  #conn.off{background:#c33; color:#fff}
  footer{padding:6px 18px; font-size:11px; color:var(--color-pine); background:var(--color-water-green)}
</style>
</head>
<body>
<header>
  <h1>MadRoomba</h1>
  <span id="conn" class="off">hors ligne</span>
  <span class="stat">Pose <b id="pose">—</b></span>
  <span class="stat">Lidar <b id="rpm">—</b> rpm</span>
  <span class="stat">Batterie <span id="battbar"><span id="battfill"></span></span> <b id="batt">—</b></span>
  <span class="stat" id="mode"></span>
</header>
<main>
  <div id="maparea">
    <canvas id="cv"></canvas>
    <div id="legend">
      <span><span class="sw" style="background:#222"></span>obstacle</span>
      <span><span class="sw" style="background:#fff;border:1px solid #999"></span>libre</span>
      <span><span class="sw" style="background:#bebebe"></span>inconnu</span>
      <span><span class="sw" style="background:#024442"></span>scan lidar</span>
      <span><span class="sw" style="background:#113B54"></span>robot</span>
      <span style="margin-left:auto">zoom <input id="zoom" type="range" min="15" max="120" value="45" style="width:110px;vertical-align:middle"></span>
      <span><label><input type="checkbox" id="follow" checked> suivre le robot</label></span>
    </div>
  </div>
  <div id="side">
    <div class="card">
      <h2>Téléopération <small>(ZQSD / WASD / flèches)</small></h2>
      <div id="pad">
        <span></span><button data-k="f">▲</button><span></span>
        <button data-k="l">◀</button><button id="stopbtn" data-k="stop">■</button><button data-k="r">▶</button>
        <span></span><button data-k="b">▼</button><span></span>
      </div>
      <div style="margin-top:8px">
        <label>Vitesse : <span id="speedval">200</span> mm/s</label>
        <input type="range" id="speed" min="100" max="400" step="25" value="200">
      </div>
    </div>
    <div class="card">
      <h2>Actions</h2>
      <div class="actions">
        <button data-cmd="clean">Nettoyage auto</button>
        <button data-cmd="dock">Retour base</button>
        <button data-cmd="safe">Reprendre contrôle</button>
        <button data-cmd="reset_pose">Reset pose</button>
        <button data-cmd="reset_map">Reset carte</button>
      </div>
    </div>
    <div class="card">
      <h2>Caméra <label style="float:right"><input type="checkbox" id="camtoggle"> activer</label></h2>
      <img id="cam" alt="camera">
    </div>
  </div>
</main>
<footer>MadRoomba — Roomba 500 + Raspberry Pi Zero + HLS-LFCD-LDS2 · cartographie temps réel</footer>
<script>
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let state = null;            // {pose:{x,y,th}, scan:[360], batt:{...}, rpm, sim}
let mapImg = null, mapMeta = null;
let ppm = 45;                // pixels per meter
document.getElementById('zoom').oninput = e => { ppm = +e.target.value; };

function resize(){
  const r = cv.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio;
  cv.height = r.height * devicePixelRatio;
}
window.addEventListener('resize', resize);

function draw(){
  requestAnimationFrame(draw);
  if (cv.width === 0) resize();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,cv.width,cv.height);

  const follow = document.getElementById('follow').checked;
  const c = (follow && state) ? state.pose : {x:0, y:0};
  const s = ppm * devicePixelRatio;
  const w2c = (x,y) => [cv.width/2 + (x-c.x)*s, cv.height/2 - (y-c.y)*s];

  if (mapImg && mapMeta){
    const extW = mapMeta.w * mapMeta.cell, extH = mapMeta.h * mapMeta.cell;
    const [ix, iy] = w2c(-extW/2, extH/2);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(mapImg, ix, iy, extW*s, extH*s);
  }
  if (state){
    const p = state.pose;
    // lidar scan
    ctx.fillStyle = '#024442';
    for (let d = 0; d < 360; d++){
      const r = state.scan[d];
      if (!r) continue;
      const a = p.th + d*Math.PI/180;
      const [x,y] = w2c(p.x + r*Math.cos(a), p.y + r*Math.sin(a));
      ctx.fillRect(x-1.5, y-1.5, 3, 3);
    }
    // robot body + heading
    const [rx,ry] = w2c(p.x, p.y);
    ctx.strokeStyle = '#113B54'; ctx.fillStyle = 'rgba(17,59,84,0.25)';
    ctx.lineWidth = 2*devicePixelRatio;
    ctx.beginPath(); ctx.arc(rx, ry, 0.17*s, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + 0.22*s*Math.cos(p.th), ry - 0.22*s*Math.sin(p.th));
    ctx.stroke();
  }
}
resize(); draw();

// ---- telemetry (SSE) ----
const conn = document.getElementById('conn');
const es = new EventSource('/api/events');
es.onopen  = () => { conn.textContent = 'connecté'; conn.classList.remove('off'); };
es.onerror = () => { conn.textContent = 'hors ligne'; conn.classList.add('off'); };
es.addEventListener('state', e => {
  state = JSON.parse(e.data);
  const p = state.pose;
  document.getElementById('pose').textContent =
    p.x.toFixed(2)+', '+p.y.toFixed(2)+' m · '+(p.th*180/Math.PI).toFixed(0)+'°';
  document.getElementById('rpm').textContent = state.rpm ? state.rpm.toFixed(0) : '—';
  document.getElementById('mode').textContent = state.sim ? 'SIMULATION' : '';
  const b = state.batt;
  if (b && b.capacity_mah){
    const pct = Math.round(100*b.charge_mah/b.capacity_mah);
    document.getElementById('batt').textContent = pct+'% ('+(b.voltage_mv/1000).toFixed(1)+' V)';
    document.getElementById('battfill').style.width = pct+'%';
  }
});
es.addEventListener('map', e => {
  const m = JSON.parse(e.data);
  const img = new Image();
  img.onload = () => { mapImg = img; mapMeta = m; };
  img.src = 'data:image/png;base64,' + m.png;
});

// ---- teleop ----
const keys = new Set();
let lastSent = '';
function speed(){ return +document.getElementById('speed').value; }
document.getElementById('speed').oninput = e =>
  document.getElementById('speedval').textContent = e.target.value;

function wheels(){
  const v = speed(), t = Math.round(v*0.6);
  const f = keys.has('f'), b = keys.has('b'), l = keys.has('l'), r = keys.has('r');
  let L = 0, R = 0;
  if (f && !b){ L = v; R = v; }
  else if (b && !f){ L = -v; R = -v; }
  if (l && !r){ if (f||b){ L = Math.round(L*0.35); } else { L = -t; R = t; } }
  else if (r && !l){ if (f||b){ R = Math.round(R*0.35); } else { L = t; R = -t; } }
  return {left: L, right: R};
}
function sendDrive(force){
  const w = wheels(), j = JSON.stringify(w);
  if (!force && j === lastSent) return;
  lastSent = j;
  fetch('/api/drive', {method:'POST', body:j}).catch(()=>{});
}
// resend while moving so the daemon's dead-man timer stays fed
setInterval(() => { if (lastSent && lastSent !== '{"left":0,"right":0}') sendDrive(true); }, 400);

const keymap = {
  'z':'f','w':'f','arrowup':'f',
  's':'b','arrowdown':'b',
  'q':'l','a':'l','arrowleft':'l',
  'd':'r','arrowright':'r',
};
window.addEventListener('keydown', e => {
  const k = keymap[e.key.toLowerCase()];
  if (!k) return;
  e.preventDefault();
  if (!keys.has(k)){ keys.add(k); sendDrive(); }
});
window.addEventListener('keyup', e => {
  const k = keymap[e.key.toLowerCase()];
  if (!k) return;
  keys.delete(k); sendDrive();
});
window.addEventListener('blur', () => { keys.clear(); sendDrive(); });

document.querySelectorAll('#pad button').forEach(btn => {
  const k = btn.dataset.k;
  if (k === 'stop'){
    btn.onclick = () => { keys.clear(); sendDrive(); cmd('stop'); };
    return;
  }
  btn.addEventListener('pointerdown', e => { e.preventDefault(); keys.add(k); sendDrive(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    btn.addEventListener(ev, () => { keys.delete(k); sendDrive(); }));
});

// ---- actions ----
function cmd(action){
  fetch('/api/cmd', {method:'POST', body: JSON.stringify({action})}).catch(()=>{});
}
document.querySelectorAll('.actions button').forEach(b => b.onclick = () => cmd(b.dataset.cmd));

// ---- camera ----
const cam = document.getElementById('cam');
document.getElementById('camtoggle').onchange = e => {
  if (e.target.checked){ cam.src = '/camera'; cam.style.display = 'block'; }
  else { cam.removeAttribute('src'); cam.style.display = 'none'; }
};
cam.onerror = () => { cam.style.display = 'none'; };
</script>
</body>
</html>
